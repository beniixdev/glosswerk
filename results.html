<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalás adatai | GlossWerk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>

<body class="booking-page" onload="loadResults()">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GlossWerk</a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="form-heading text-center mb-5">
                <p class="section-kicker">Foglalási összesítő</p>
                <h1>Elküldött adatok</h1>
                <p>Ellenőrizd a megadott foglalási adatokat.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-7 col-md-9">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <div id="results-container" class="results-list"></div>

                            <div class="result-actions">
                                <a class="btn btn-primary" href="form.html">Új foglalás</a>
                                <a class="btn btn-outline-dark" href="index.html">Vissza a főoldalra</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 GlossWerk Detailing</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
